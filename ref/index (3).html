  <script>

document.getElementById('subscribeForm').addEventListener('submit', function (e) {

  e.preventDefault();



  const email = document.querySelector('input[name="email"]').value;

  const agree = document.getElementById('agree').checked;



  if (!agree) {

    alert('Please agree to the privacy policy before subscribing.');

    return;

  }



  const formData = new FormData();

  formData.append('email', email);



  fetch('submit.php', {

    method: 'POST',

    body: formData

  })

  .then(response => response.text())

  .then(responseText => {

    document.getElementById('subscribeForm').style.display = 'none';

    document.getElementById('thankYouMessage').style.display = 'block';

  })

  .catch(error => {

    console.error('Error:', error);

    alert('An error occurred. Please try again later.');

  });

});

</script>



<script>

document.addEventListener("DOMContentLoaded", function () {

  const hamburger = document.querySelector(".hamburger");

  const menu = document.querySelector(".mobile-menu");

  const closeBtn = document.querySelector(".mobile-menu .close-btn");



  hamburger.addEventListener("click", function () {

    menu.classList.toggle("open");

  });



  if (closeBtn) {

    closeBtn.addEventListener("click", function () {

      menu.classList.remove("open");

    });

  }

});

</script>

<script>
// adjust-social-icons-above-footer
(function(){
  function adjustSocialIcons(){
    try {
      var icons = document.querySelector('.social-icons');
      if (!icons) return;
      var footer = document.querySelector('.footer');
      var fallback = 33; // px, fallback if no footer
      if (footer && getComputedStyle(footer).display !== 'none') {
        var h = footer.offsetHeight || parseInt(getComputedStyle(footer).height) || 0;
        icons.style.bottom = (h + 10) + 'px';
      } else {
        icons.style.bottom = fallback + 'px';
      }
    } catch (e) { /* noop */ }
  }
  window.addEventListener('load', adjustSocialIcons);
  window.addEventListener('resize', adjustSocialIcons);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) adjustSocialIcons(); });
})();
</script>
