<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frankie Chan — Email Signature</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <!--
    HTML email signature for Frankie Chan
    Uses design tokens inspired by index.html (inlined for email client compatibility)
    - Colors: fg #1d1d1f, muted #6e6e73, hairline #d2d2d7, link #06c
    - Fonts: system stack
    - Chip: rounded hairline pill
  -->
  <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;border-collapse:collapse;font:400 15px/1.45, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial; color:#1d1d1f;">
    <tr>
      <td style="padding:0 0 12px 0;border-bottom:1px solid #d2d2d7;">&nbsp;</td>
    </tr>
    <tr>
      <td style="padding:16px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
          <tr>
            <td style="vertical-align:top;padding-right:12px;">
              <a href="https://omdigital.agency/" style="text-decoration:none;">
                <img src="https://dailysignals.info/images/om-logo-black.png" width="36" height="36" alt="OM Digital" style="display:block;border:0;outline:none;border-radius:6px;">
              </a>
            </td>
            <td style="vertical-align:top;">
              <div style="font-weight:600;font-size:16px;">Frankie Chan</div>
              <div style="color:#6e6e73;font-size:14px;">Founder</div>
              <div style="margin-top:2px;color:#1d1d1f;font-size:14px;">
                <strong>OM Digital</strong> — <a href="https://omdigital.agency" style="color:#1d1d1f;text-decoration:none;">https://omdigital.agency</a>
              </div>
              <div style="margin-top:8px;color:#1d1d1f;font-size:14px;line-height:1.4;">
                Less labor. More flow.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:10px 0;border-top:1px solid #d2d2d7;color:#6e6e73;font-size:12px;">London‑based · Global reach</td>
    </tr>
  </table>
</body>
</html>
